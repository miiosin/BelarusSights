<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BelarusSights — Достопримечательности Беларуси</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header>
    <a href="#" class="logo-link">
  <img src="logo.png" class="logo-img">
</a>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Поиск достопримечательностей...">
    </div>

    <div class="filters">
      <select id="region-filter">
        <option value="all">Все области</option>
        <option value="Брестская">Брестская</option>
        <option value="Витебская">Витебская</option>
        <option value="Гомельская">Гомельская</option>
        <option value="Гродненская">Гродненская</option>
        <option value="Минская">Минская</option>
        <option value="Могилевская">Могилевская</option>
      </select>

      <select id="category-filter">
        <option value="all">Все категории</option>
        <option value="Замки">Замки и дворцы</option>
        <option value="Храмы">Храмы и костелы</option>
        <option value="Природа">Природа</option>
        <option value="Архитектура">Архитектура</option>
      </select>
    </div>
  </header>

  
  <div id="map-container">
    <div id="map"></div>
  </div>

  <section id="catalog-container">
    <h2 class="catalog-title">Достопримечательности</h2>
    <div class="grid" id="grid"></div>
  </section>

  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="map.js"></script>
  <script src="script.js"></script>

</body>
</html>
